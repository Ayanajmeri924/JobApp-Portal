<!DOCTYPE html>
<html lang="en" >
<head>
    <title>Add Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white container mt-5">
    <div class="col-md-6 offset-md-3">
        <h2>Post a New Job</h2>
        <form action="handleForm" method="post">
            <div class="mb-3">
                <label>Job ID:</label>
                <input type="number" name="postId" class="form-control" required />
            </div>
            <div class="mb-3">
                <label>Job Profile:</label>
                <input type="text" name="postProfile" class="form-control" required />
            </div>
            <div class="mb-3">
                <label>Description:</label>
                <textarea name="postDesc" class="form-control" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label>Required Experience (Years):</label>
                <input type="number" name="reqExperience" class="form-control" required />
            </div>
            <div class="mb-3">
                <label>Tech Stack (Comma-separated):</label>
                <input type="text" name="postTechStack" class="form-control" placeholder="Java, Spring, SQL" required />
            </div>
            <button type="submit" class="btn btn-primary">Submit Job</button>
            <a href="home" class="btn btn-secondary ms-2">Back to Home</a>
        </form>
    </div>
</body>
</html>
