<!--<%@ page language="java" contentType="text/html; charset=UTF-8" pageEncoding="UTF-8"%>-->
<!--<%@ taglib prefix="c" uri="jakarta.tags.core" %>-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white container mt-5">
    <h2 class="mb-4">Available Job Listings</h2>

    <!-- Search Form -->
    <form action="search" method="get" class="d-flex mb-4">
        <input type="text" name="keyword" class="form-control me-2" placeholder="Search by profile or tech stack..." >
        <button type="submit" class="btn btn-outline-success">Search</button>
    </form>

    <div class="row">
        <div class="col-md-6 mb-4" th:each="jobPost : ${jobPosts}">
            <div class="card border-light bg-secondary text-white">
                <div class="card-body">
                    <h5 class="card-title" th:text="${jobPost.postProfile}"></h5>
                    <p class="card-text"><strong>Description:</strong> <span th:text="${jobPost.postDesc}"></span></p>
                    <p class="card-text"><strong>Experience:</strong> <span th:text="${jobPost.reqExperience}"></span> years</p>
                    <div>
                        <strong>Tech Stack:</strong>
                        <ul>
                            <li th:each="tech : ${jobPost.postTechStack}" th:text="${tech}"></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <a href="home" class="btn btn-light mt-3">Back to Home</a>
</body>
</html>
